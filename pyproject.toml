[project]
name = "arknight-auto-editing"
version = "26.10.7"
description = "明日方舟剪辑工具"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "imageio",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
]
# 可选的 NVIDIA 匹配加速（CUDA）。不装也能跑：匹配自动回退 OpenCL / CPU。
# 安装：uv pip install --index-url https://download.pytorch.org/whl/cu128 torch
# 也可用程序内「性能/GPU」页的「下载并启用」，或 packaging/gpu_pack.ps1 构建离线加速包。
gpu = [
    "torch",
]

[project.scripts]
arknight-auto-editing = "main:main"
