# 难度混合与课程配置 (plan §4)
# 权重随训练进度线性漂移: 前期简单样本占多数, 后期复杂样本占多数。
# 每个 batch 内【逐样本】抽难度 -> 同 batch 天然混有 D0 与 D4。

curriculum:
  weight_start: [0.40, 0.30, 0.18, 0.09, 0.03]   # D0 D1 D2 D3 D4
  weight_end:   [0.15, 0.20, 0.25, 0.25, 0.15]

synth:
  window: 10.0            # 窗口长度 (秒) —— 用户口径: 10s 内约 20 条模板混叠
  n_bands: 16             # EQ 频带数 (与模型输出维度一致)
  short_atom_dur: 0.6     # 短于此的原子才可能自重复
  max_instances: 64       # 自重复 + 近邻后的硬上限
  atom_target_rms_db: -26.0   # 每个原子归一化到的电平 (混音器推子基准)
  safety_ceiling: 0.98    # 最终硬上限, 防爆音

  # 各难度的原子条数 (D4 对应用户口径的 ~20 条/窗)
  n_atoms:
    D0: [1, 1]
    D1: [2, 4]
    D2: [6, 10]
    D3: [12, 18]
    D4: [20, 28]

  # 自重复: 短原子在窗内重复的概率与次数
  self_repeat: {D1: 0.05, D2: 0.25, D3: 0.45, D4: 0.60}
  repeat_range: [2, 5]
  exact_dup_prob: 0.15    # 完全同起点 (同帧两个单位放同一技能)

  # 同组近邻困难负样本 (p_imp_3 的兄弟) 的混入概率 —— 按"每原子"计
  hard_neighbor: {D2: 0.5, D3: 0.8, D4: 1.0}
  hard_neighbor_range: [1, 3]
  leak_to_easy: 0.05      # 让 D1/D2 也有 5% 概率见到近邻歧义

  # 背景与干扰
  bg_prob: {D0: 0.70, D1: 0.80, D2: 0.85, D3: 0.90, D4: 0.95}
  bg_db: {D0: [-42, -24], D1: [-40, -22], D2: [-40, -20], D3: [-38, -18], D4: [-36, -16]}
  interf: {D0: [0, 0], D1: [0, 1], D2: [0, 1], D3: [1, 2], D4: [1, 3]}
  interf_db: {D0: [-60, -60], D1: [-45, -30], D2: [-40, -24], D3: [-36, -20], D4: [-32, -16]}

  # 总增益 / 编解码 / 限幅
  master_gain_db: {D0: [-6, 0], D1: [-6, 0], D2: [-6, 0], D3: [-5, 0], D4: [-4, 0]}
  codec_prob: {D0: 0.0, D1: 0.1, D2: 0.3, D3: 0.5, D4: 0.5}
  limiter_prob: {D0: 0.0, D1: 0.1, D2: 0.3, D3: 0.4, D4: 0.5}

# 训练期试听导出 (plan §6)
progress:
  enabled: true
  export_acc_threshold: 0.80   # val_acc 达到此值后, 每次 best 更新导出一份
  rec_iters: 1                 # 导出只用 1 轮回灌 (保持轻量, 不阻塞训练)

loss:
  ev: 1.0
  pos: 0.5
  presence: 1.0
  id: 1.0
  par: 1.0
  # 波形重建辅助项 (直接监督"能不能抵消")。
  # 默认 0.0: 它要求"预测参数 -> 可微变换 -> 波形"完全对齐, 参数还没学时是误导性
  # 梯度; 建议在 par 损失明显下降 (时延误差 < 0.1 采样量级) 后再开到 0.3~0.5。
  # 打开需要 aux 提供 transform + wav + 绝对增益, 见 models/losses.py::_recon_loss。
  rec: 0.0
